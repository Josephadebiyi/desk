# Render Blueprint — Dashboard → New → Blueprint → pick this repo.
# One web service (app + API) and two cron jobs. Secrets marked `sync: false` are entered in the Render dashboard.
services:
  - type: web
    name: ziondesk
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_AUTH_HOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_WEBHOOK_HASH
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_WHATSAPP_CONTENT_SID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TEMPLATE
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: CRON_SECRET # created automatically
        generateValue: true

  - type: cron
    name: ziondesk-hourly # scheduled messages + event reminders
    runtime: node
    schedule: "5 * * * *"
    buildCommand: "true"
    startCommand: node -e "fetch('http://'+process.env.APP_HOSTPORT+'/api/cron/hourly',{method:'POST',headers:{Authorization:'Bearer '+process.env.CRON_SECRET}}).then(r=>r.text()).then(console.log)"
    envVars:
      - key: APP_HOSTPORT # private network address of the web service
        fromService: { type: web, name: ziondesk, property: hostport }
      - key: CRON_SECRET
        fromService: { type: web, name: ziondesk, envVarKey: CRON_SECRET }

  - type: cron
    name: ziondesk-daily # birthday emails
    runtime: node
    schedule: "0 7 * * *"
    buildCommand: "true"
    startCommand: node -e "fetch('http://'+process.env.APP_HOSTPORT+'/api/cron/daily',{method:'POST',headers:{Authorization:'Bearer '+process.env.CRON_SECRET}}).then(r=>r.text()).then(console.log)"
    envVars:
      - key: APP_HOSTPORT # private network address of the web service
        fromService: { type: web, name: ziondesk, property: hostport }
      - key: CRON_SECRET
        fromService: { type: web, name: ziondesk, envVarKey: CRON_SECRET }
