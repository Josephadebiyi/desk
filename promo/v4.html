<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>ZionDesk launch v4</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=Inter:wght@500;600;700;800&family=Caveat:wght@700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
<script src="words-v4.js"></script>
<style>
  /* ZionDesk palette — deliberately not the reference's colours */
  :root { --p: #6c34ff; --p2: #8f63ff; --l: #c4ec62; --ink: #14121c; --cream: #f6f2ea; --coral: #ff5a4e; --desk: #1b1440; --lav: #e9e2ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: Inter, sans-serif; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .sc { position: absolute; inset: 0; display: none; overflow: hidden; }
  .cam { position: absolute; inset: 0; transform-origin: 50% 45%; }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  .center { position: absolute; left: 50%; top: 50%; }
  .cream { background: radial-gradient(75% 55% at 50% 45%, #fffdf8 0%, var(--cream) 60%, #e7dfd1 100%); }
  .night { background: radial-gradient(70% 55% at 50% 45%, #241d3f 0%, #0d0b17 80%); }
  .violet { background: radial-gradient(65% 50% at 50% 45%, #8f63ff 0%, #6c34ff 45%, #2a138a 100%); }
  .desk { background-color: var(--desk); background-image:
      linear-gradient(rgba(196,236,98,.13) 2px, transparent 2px), linear-gradient(90deg, rgba(196,236,98,.13) 2px, transparent 2px),
      linear-gradient(rgba(233,226,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(233,226,255,.06) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px; }
  .vig::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(80% 60% at 50% 45%, transparent 40%, rgba(0,0,0,.6)); }
  .disp { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; letter-spacing: -0.035em; line-height: 1.04; color: var(--ink); white-space: nowrap; text-align: center; }
  .serif { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
  .w { display: inline-block; }
  .bub { font-family: Inter; font-weight: 600; font-size: 62px; line-height: 1.15; padding: 30px 46px; border-radius: 56px; max-width: 860px; white-space: nowrap; box-shadow: 0 24px 50px -24px rgba(20,18,28,.35); }
  .bub.in { background: #fff; color: var(--ink); border-bottom-left-radius: 14px; }
  .bub.out { background: var(--l); color: #17200a; border-bottom-right-radius: 14px; }
  .dots { display: flex; gap: 16px; padding: 34px 44px; border-radius: 50px; background: #fff; border-bottom-left-radius: 14px; box-shadow: 0 24px 50px -24px rgba(20,18,28,.35); }
  .dots i { width: 26px; height: 26px; border-radius: 50%; background: #b9b3c9; display: block; }
  .tile { width: 250px; height: 250px; border-radius: 60px; display: grid; place-items: center; box-shadow: 0 34px 60px -24px rgba(0,0,0,.6), inset 0 -8px 0 rgba(0,0,0,.12); }
  .tile svg { width: 120px; height: 120px; }
  .tlabel { position: absolute; top: 272px; left: 50%; transform: translateX(-50%); font-family: 'Bricolage Grotesque'; font-weight: 700; font-size: 40px; color: #fff; white-space: nowrap; text-shadow: 0 4px 20px rgba(0,0,0,.5); }
  .badge { position: absolute; right: -14px; top: -14px; width: 74px; height: 74px; border-radius: 50%; background: var(--coral); color: #fff; font: 800 34px Inter; display: grid; place-items: center; box-shadow: 0 10px 24px rgba(255,90,78,.5); }
  .phone { width: 560px; height: 1140px; border-radius: 86px; background: #0e0c16; padding: 22px; box-shadow: 0 70px 140px -40px rgba(0,0,0,.75), inset 0 0 0 3px #2c2840; }
  .phone .scr { width: 100%; height: 100%; border-radius: 66px; overflow: hidden; background: #efe9f9; position: relative; }
  .chip { display: flex; align-items: center; gap: 16px; padding: 18px 30px 18px 18px; border-radius: 999px; background: #fff; font: 700 42px Inter; color: var(--ink); white-space: nowrap; box-shadow: 0 20px 44px -18px rgba(0,0,0,.45); }
  .chip i { font-style: normal; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 32px; }
  .card { border-radius: 34px; overflow: hidden; background: #fff; box-shadow: 0 60px 120px -40px rgba(30,15,90,.6), 0 0 0 2px rgba(20,18,28,.06); }
  .card img { width: 100%; display: block; }
  .paper { background: #fffdf7; border-radius: 22px; box-shadow: 0 40px 80px -30px rgba(0,0,0,.6); padding: 46px 50px; font-family: Inter; color: var(--ink); }
  .hand { font-family: Caveat, cursive; font-weight: 700; color: #2b3b8f; }
  .sub { position: absolute; left: 70px; right: 70px; bottom: 200px; text-align: center; font: 600 46px/1.28 Inter; color: #fff; text-shadow: 0 3px 18px rgba(0,0,0,.85); letter-spacing: -0.01em; }
  .sub b { color: var(--l); font-weight: 700; }
  .sub.onlight { color: var(--ink); text-shadow: 0 0 22px rgba(255,255,255,.95); }
  .sub.onlight b { color: var(--p); }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .06; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  #flash { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <!-- 1 hook --><section class="sc cream" id="s1"><div class="cam" id="c1"><div class="abs" id="s1tiles"></div><div class="center" id="s1a"></div><div class="center" id="s1five"></div><div class="center" id="s1b"></div></div></section>
  <!-- 2 the five tools --><section class="sc desk vig" id="s2"><div class="cam" id="c2"><div class="abs" id="s2tiles"></div><div class="center" id="s2label"></div></div></section>
  <!-- 3 every Monday --><section class="sc cream" id="s3"><div class="cam" id="c3"><svg class="abs" id="s3thread" width="1080" height="1920" style="overflow:visible"></svg><div class="abs" id="s3tiles"></div><div class="center" id="s3text"></div></div></section>
  <!-- 4 why? / it's the process --><section class="sc cream" id="s4"><div class="cam" id="c4"><div class="abs" id="s4head"></div><div class="abs" id="s4thread"></div></div></section>
  <!-- 5 no. that's the problem --><section class="sc night" id="s5"><div class="cam" id="c5"><div class="center" id="s5no"></div><div class="center" id="s5a"></div><div class="center" id="s5b"></div></div></section>
  <!-- 6 cracks --><section class="sc night" id="s6"><div class="cam" id="c6"><div class="abs" id="s6tiles"></div><svg class="abs" id="s6crack" width="1080" height="1920" style="overflow:visible"></svg><div class="abs" id="s6people"></div><div class="center" id="s6text"></div></div></section>
  <!-- 7 nobody calls / nobody notices --><section class="sc night" id="s7"><div class="cam" id="c7"><div class="abs" id="s7card"></div><div class="abs" id="s7phone"></div><div class="abs" id="s7cal"></div><div class="center" id="s7text"></div></div></section>
  <!-- 8 so we built ZionDesk --><section class="sc violet" id="s8"><div class="cam" id="c8"><div class="abs" id="s8tiles"></div><div class="center" id="s8glow" style="width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle, rgba(196,236,98,.55), rgba(196,236,98,0) 62%)"></div><div class="center" id="s8logo"><img src="../public/brand/mark.png" style="width:400px;display:block" /></div><div class="center" id="s8word"></div><div class="center" id="s8text"></div></div></section>
  <!-- 9 QR register --><section class="sc desk vig" id="s9"><div class="cam" id="c9"><div class="abs" id="s9qr"></div><div class="abs" id="s9phone"><div class="phone"><div class="scr"><img src="shots/phone-join.png" style="width:100%" /></div></div></div><div class="abs" id="s9ok"></div></div></section>
  <!-- 10 follow-ups --><section class="sc cream" id="s10"><div class="cam" id="c10"><div class="abs" id="s10phone"><div class="phone"><div class="scr" id="s10scr"></div></div></div><div class="abs" id="s10chips"></div><div class="abs" id="s10auto"></div></div></section>
  <!-- 11 dashboard --><section class="sc cream" id="s11"><div class="cam" id="c11"><div class="abs" id="s11card"><div class="card" style="width:980px"><img src="shots/overview.png" /></div></div><div class="abs" id="s11chips"></div><div class="center" id="s11text"></div></div></section>
  <!-- 12 flyer + less/more time --><section class="sc night" id="s12"><div class="cam" id="c12"><div class="abs" id="s12bub"></div><div class="abs" id="s12flyers"></div><div class="abs" id="s12post"></div><div class="abs" id="s12hearts"></div><div class="center" id="s12a"></div><div class="center" id="s12b"></div></div></section>
  <!-- 13 offer --><section class="sc violet" id="s13"><div class="cam" id="c13"><div class="center" id="s13count"></div><div class="center" id="s13pct"></div><div class="center" id="s13code"></div></div></section>
  <!-- 14 end --><section class="sc cream" id="s14"><div class="cam" id="c14"><div class="center" id="s14logo"></div><div class="center" id="s14line"></div><div class="center" id="s14url"></div></div></section>
  <div id="flash"></div>
  <div class="sub" id="sub"></div>
  <div class="grain"></div>
</div>
<script>
const W = window.WORDS
const NOSUB = location.search.includes('nosub')
const clean = (w) => w.toLowerCase().replace(/[^a-z0-9'-]/g, '')
function T(word, n = 1, end = false) {
  let c = 0
  for (const x of W) if (clean(x.w) === clean(word) && ++c === n) return end ? x.e : x.s
  throw new Error('word ' + word + ' #' + n)
}
const E = (w, n = 1) => T(w, n, true)
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const P = (t, a, b) => clamp((t - a) / (b - a))
const lerp = (a, b, k) => a + (b - a) * k
const eo = (k) => 1 - Math.pow(1 - k, 3)
const eo5 = (k) => 1 - Math.pow(1 - k, 5)
const eio = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2)
const back = (k, s = 1.7) => 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2)
const pop = (t, t0, d = 0.32, s = 2.2) => back(P(t, t0, t0 + d), s)
const $ = (id) => document.getElementById(id)
function put(el, o) {
  el.style.transform = `${o.persp ? `perspective(1800px) rotateX(${o.rx || 0}deg) rotateY(${o.ry || 0}deg) ` : ''}translate(${o.x ?? 0}px, ${o.y ?? 0}px)${o.c ? ' translate(-50%, -50%)' : ''} rotate(${o.r ?? 0}deg) scale(${o.s ?? 1})`
  el.style.opacity = o.o ?? 1
  el.style.filter = o.blur ? `blur(${o.blur}px)` : ''
}
function h(tag, cls, html, parent, style) {
  const e = document.createElement(tag)
  if (cls) e.className = cls
  if (html != null) e.innerHTML = html
  if (style) e.setAttribute('style', style)
  if (parent) parent.appendChild(e)
  return e
}
/** Kinetic words: each word drops in on its spoken time. list: [[html, t, style?]] */
function say(t, el, list, o = {}) {
  el.innerHTML = ''
  const line = h('div', 'disp', '', el, `font-size:${o.size ?? 104}px;${o.style ?? ''}`)
  for (const [text, ts, st] of list) {
    if (text === '<br/>') { if (t >= ts - 0.05) h('br', null, null, line); continue }
    if (t < ts - 0.05) continue
    const k = back(P(t, ts - 0.05, ts + 0.25), 2.4)
    const w = h('span', 'w', text, line, `margin:0 .12em;${st || ''}`)
    w.style.transform = `translateY(${lerp(70, 0, k)}px) scale(${lerp(0.6, 1, k)}) rotate(${lerp(-6, 0, k)}deg)`
    w.style.opacity = P(t, ts - 0.05, ts + 0.06)
  }
  el.style.transform = `translate(-50%, -50%) translate(${o.x || 0}px, ${o.y || 0}px) scale(${o.s ?? 1})`
  el.style.opacity = o.o ?? 1
}
const shake = (t, t0, amp = 18, d = 0.35) => { const k = P(t, t0, t0 + d); return k > 0 && k < 1 ? Math.sin(k * 60) * amp * (1 - k) : 0 }

const ICON = {
  qr: '<svg viewBox="0 0 24 24" fill="none" stroke="#14121c" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>',
  form: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
  sheet: '<svg viewBox="0 0 24 24" fill="none" stroke="#14121c" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  give: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21.2l8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg>',
}
// Tools in ZionDesk-family colours (not the reference's): white, violet, lime, indigo, coral
const TOOLS = [
  { k: 'qr', label: 'QR code site', bg: '#ffffff', t: () => T('qr') },
  { k: 'form', label: 'Visitor form', bg: '#8f63ff', t: () => T('google') },
  { k: 'sheet', label: 'Spreadsheet', bg: '#c4ec62', t: () => T('spreadsheet') },
  { k: 'chat', label: 'Group chat', bg: '#3b2f86', t: () => T('whatsapp') },
  { k: 'give', label: 'Giving app', bg: '#ff5a4e', t: () => T('another') },
]

/* ───────── subtitles (the script, phrase by phrase) ───────── */
const PH = []
{
  let a = 0
  W.forEach((w, i) => {
    const end = /[.?!…"]$/.test(w.w)
    const long = i - a >= 8 && /,$/.test(w.w)
    if (end || long || i === W.length - 1) { PH.push([a, i]); a = i + 1 }
  })
}
const SUB_SCENES = new Set(['s2', 's9', 's10'])
function subtitles(t, light, scene) {
  const el = $('sub')
  if (NOSUB || !SUB_SCENES.has(scene)) return (el.innerHTML = '')
  const ph = PH.find(([a, b]) => t >= W[a].s - 0.15 && t <= W[b].e + 0.35)
  if (!ph) return (el.innerHTML = '')
  el.className = 'sub' + (light ? ' onlight' : '')
  el.innerHTML = W.slice(ph[0], ph[1] + 1).map((w) => (t >= w.s ? (t < w.e + 0.08 ? `<b>${w.w}</b>` : w.w) : `<span style="opacity:.28">${w.w}</span>`)).join(' ')
}

/* ───────── scenes: [id, start, end, light background?, entry: 'whip'|'zoom'|'flash'|'cut'] ───────── */
const S = [
  ['s1', -1, T('a') - 0.35, 1, 'cut'],
  ['s2', T('a') - 0.35, T('and') - 0.3, 0, 'whip'],
  ['s3', T('and') - 0.3, T('why', 2) - 0.45, 1, 'zoom'],
  ['s4', T('why', 2) - 0.45, T('no') - 0.12, 1, 'whip'],
  ['s5', T('no') - 0.12, T('because') - 0.3, 0, 'flash'],
  ['s6', T('because') - 0.3, T('first-time') - 0.35, 0, 'zoom'],
  ['s7', T('first-time') - 0.35, T('so') - 0.3, 0, 'whip'],
  ['s8', T('so') - 0.3, T('newcomers', 2) - 0.35, 0, 'flash'],
  ['s9', T('newcomers', 2) - 0.35, T('follow-ups') - 0.3, 0, 'whip'],
  ['s10', T('follow-ups') - 0.3, T('members') - 0.3, 1, 'whip'],
  ['s11', T('members') - 0.3, T('need', 2) - 0.3, 1, 'zoom'],
  ['s12', T('need', 2) - 0.3, T('first') - 0.45, 0, 'whip'],
  ['s13', T('first') - 0.45, T('ziondesk', 2) - 0.4, 0, 'flash'],
  ['s14', T('ziondesk', 2) - 0.4, 999, 1, 'zoom'],
]
const DURATION = window.DURATION

/* ───────── build static pieces ───────── */
function tileEl(tool, parent, withLabel = true) {
  const d = h('div', 'abs', '', parent)
  h('div', 'tile', ICON[tool.k], d, `background:${tool.bg}`)
  if (withLabel) h('div', 'tlabel', tool.label, d)
  return d
}
const t1 = TOOLS.map((tool) => tileEl(tool, $('s1tiles'), false))
const t2 = TOOLS.map((tool, i) => { const d = tileEl(tool, $('s2tiles')); h('div', 'badge', [3, 12, 7, 99, 5][i], d.firstChild); return d })
const t3 = TOOLS.map((tool) => tileEl(tool, $('s3tiles'), false))
const t6 = TOOLS.slice(0, 4).map((tool) => tileEl(tool, $('s6tiles'), false))
const t8 = TOOLS.map((tool) => tileEl(tool, $('s8tiles'), false))

// scene 4: chat thread
$('s4head').innerHTML = `<div style="width:1080px;padding:120px 60px 30px;display:flex;align-items:center;gap:26px;border-bottom:2px solid rgba(20,18,28,.08)">
  <div style="width:110px;height:110px;border-radius:50%;background:var(--p);display:grid;place-items:center;font:800 44px 'Bricolage Grotesque';color:#fff">CW</div>
  <div><div style="font:800 52px 'Bricolage Grotesque';color:var(--ink);letter-spacing:-.02em">Church workers 🙏</div><div style="font:500 32px Inter;color:#7d7590">Pastor, Media, Ushers, Finance +18</div></div></div>`
const th = $('s4thread')
const m1 = h('div', 'abs bub out', 'Why do we need 5 apps for one Sunday? 🤔', th, 'font-size:50px;white-space:normal;width:700px')
const d1 = h('div', 'abs dots', '<i></i><i></i><i></i>', th)
const m2 = h('div', 'abs bub in', 'Why?', th, 'font-size:120px;padding:40px 70px')
const d2 = h('div', 'abs dots', '<i></i><i></i><i></i>', th)
const m3 = h('div', 'abs bub in', 'It’s the process. 🤷🏾‍♂️', th, 'font-size:74px')
const sender = (el, name) => h('div', null, name, el, 'position:absolute;top:-46px;left:12px;font:600 30px Inter;color:#8a83a0')
sender(m2, 'Media team')
sender(m3, 'Admin')

// scene 6: people on a floor
const PEOPLE = ['#e3824f', '#3f8f7a', '#c4ec62', '#8f63ff', '#ffb547']
const ppl = PEOPLE.map((c, i) => h('div', 'abs', `<svg width="150" height="260" viewBox="-75 -250 150 260"><circle cx="0" cy="-200" r="46" fill="#f0d6bf" opacity=".95"/><path d="M-66 0V-110Q-66-160 0-160Q66-160 66-110V0Z" fill="${c}"/></svg>`, $('s6people')))

// scene 7: visitor card, phone, calendar
$('s7card').innerHTML = `<div class="paper" style="width:700px;transform-origin:50% 50%">
  <div style="font:800 54px 'Bricolage Grotesque';letter-spacing:-.02em">Welcome! First time? 👋</div>
  <div style="margin-top:34px;font:500 30px Inter;color:#8a83a0">Name</div><div class="hand" style="font-size:72px;border-bottom:3px dashed #ddd2c4">Ada Okafor</div>
  <div style="margin-top:22px;font:500 30px Inter;color:#8a83a0">Phone</div><div class="hand" style="font-size:72px;border-bottom:3px dashed #ddd2c4">+234 803 •••• •••</div></div>`
$('s7phone').innerHTML = `<div style="width:520px;padding:40px;border-radius:44px;background:#1f1a33;color:#fff;text-align:center;box-shadow:0 50px 100px -30px rgba(0,0,0,.7)">
  <div style="font:600 32px Inter;color:#a59cc4">Calls this week</div><div style="font:800 190px 'Bricolage Grotesque';line-height:1;margin-top:10px" id="s7zero">0</div><div style="font:600 32px Inter;color:#a59cc4">to Ada</div></div>`
$('s7cal').innerHTML = `<div style="display:flex;gap:26px">${['Sun 6', 'Sun 13', 'Sun 20'].map((d) => `<div class="s7day" style="width:260px;height:300px;border-radius:36px;background:#fffdf7;position:relative;box-shadow:0 30px 60px -24px rgba(0,0,0,.6);text-align:center;padding-top:40px"><div style="font:800 30px Inter;color:#8a83a0;letter-spacing:.08em">${d.split(' ')[0].toUpperCase()}</div><div style="font:800 120px 'Bricolage Grotesque';color:var(--ink);line-height:1.1">${d.split(' ')[1]}</div><div class="s7x" style="position:absolute;inset:0;display:grid;place-items:center;font:700 260px Caveat;color:var(--coral)">✕</div></div>`).join('')}</div>`

// scene 9: QR card
$('s9qr').innerHTML = `<div class="paper" style="width:440px;text-align:center;padding:40px">
  <div style="font:800 46px 'Bricolage Grotesque'">New here?</div><div style="font:500 28px Inter;color:#8a83a0;margin:6px 0 22px">Scan to say hello 👋</div>
  <div style="position:relative;width:330px;height:330px;margin:0 auto" id="s9code"></div></div>`
;(() => {
  let r = 7; const rnd = () => ((r = (r * 9301 + 49297) % 233280) / 233280)
  const n = 25, c = 330 / n; let s = ''
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { const f = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9); if (!f && rnd() > 0.52) s += `<rect x="${x * c}" y="${y * c}" width="${c + 0.4}" height="${c + 0.4}" fill="#14121c"/>` }

      const t0 = [T('whatsapp', 2), T('sms'), T('email')][i]
      const k = pop(t, t0 - 0.05, 0.32)
      put(d, { x: [40, 680, 60][i], y: [260, 520, 1420][i] + Math.sin(t * 2 + i) * 8, s: k, o: P(t, t0 - 0.05, t0), r: [-6, 5, -3][i] })
    })
    const zin = eio(P(t, T('go') - 0.2, T('go') + 0.5)) * (1 - eio(P(t, T('automatically') - 0.3, T('automatically') + 0.2)))
    const zl = eio(P(t, T('in') - 0.1, T('own') + 0.3)) * (1 - eio(P(t, T('language.') + 0.2, T('language.') + 0.8)))
    $('c10').style.transform += ` scale(${1 + zin * 0.45 + zl * 0.3}) translate(${zin * 15}px, ${zin * 214 + zl * 40}px)`
    const a = pop(t, T('automatically') - 0.05, 0.35, 2.6)
    put($('s10auto'), { x: 560, y: 1300 + shake(t, T('automatically'), 8), s: a * 1.15, o: P(t, T('automatically') - 0.05, T('automatically')), r: 4 })
  }

  /* 11 · all in one dashboard */
  {
    const k = eo5(P(t, S[10][1], S[10][1] + 0.6))
    const all = eio(P(t, T('all', 2) - 0.1, E('dashboard.') + 0.3))
    put($('s11card'), { persp: true, rx: lerp(28, 8, k) * (1 - all), ry: lerp(-14, 0, k) * (1 - all), x: 50, y: lerp(900, 720, k) - all * 60, s: lerp(0.85, 1, k) * lerp(1, 1.05, all) })
    const spots = [[60, 380], [600, 330], [70, 1330], [650, 1380], [250, 1560]]
    const times = [T('members'), T('attendance'), T('giving', 2), T('events'), T("branches'")]
    ch11.forEach((d, i) => {
      const kk = pop(t, times[i] - 0.05, 0.32)
      put(d, { x: lerp(spots[i][0], 400, all), y: lerp(spots[i][1], 900, all) + Math.sin(t * 2 + i) * 6, s: kk * lerp(1, 0.3, all), o: P(t, times[i] - 0.05, times[i]) * (1 - P(all, 0.7, 1)), r: [-5, 4, 3, -4, 2][i] })
    })
    say(t, $('s11text'), [['All in', T('all', 2)], ['<span class="serif">one dashboard.</span>', T('one', 5), 'color:var(--p)']], { y: -650, size: 104 })
  }

  /* 12 · "Need a flyer?" · designers · less time chasing spreadsheets · more time with people */
  {
    const b = pop(t, S[11][1] + 0.1, 0.35)
    const out = P(t, T('less') - 0.3, T('less'))
    put($('s12bub'), { x: 240, y: 300 - out * 200, s: b, o: 1 - out })
    fly.forEach((f, i) => {
      const t0 = T('designers') + i * 0.12
      const k = eo5(P(t, t0, t0 + 0.5))
      put(f, { x: 375 + (i - 1.5) * 190 * k, y: 760 + Math.abs(i - 1.5) * 40 * k - out * 1200, r: (i - 1.5) * 12 * k, s: lerp(0.5, 0.95, k), o: P(t, t0, t0 + 0.1) * (1 - out) })
    })
    // the flyer goes live as a post: likes count up, hearts float
    const po = eo5(P(t, T('make') - 0.1, T('make') + 0.45))
    put($('s12post'), { persp: true, rx: lerp(25, 0, po), x: 220, y: lerp(1300, 520, po) - out * 1400, s: lerp(0.7, 1, po), r: lerp(8, -2, po), o: P(t, T('make') - 0.1, T('make')) * (1 - out) })
    $('s12like').textContent = t > T('you.') ? '❤️' : '♡'
    $('s12like').style.display = 'inline-block'; $('s12like').style.transform = `scale(${t > T('you.') ? pop(t, T('you.'), 0.3, 3) : 1})`
    $('s12likes').textContent = Math.round(lerp(0, 1284, eo(P(t, T('you.'), T('less') - 0.2)))).toLocaleString('en-US')
    hearts12.forEach((e, i) => {
      const t0 = T('you.') + i * 0.07
      const k = P(t, t0, t0 + 1.4)
      put(e, { x: 300 + ((i * 53) % 380) + Math.sin(k * 6 + i) * 40, y: 1250 - k * 700, s: lerp(0.5, 1.2, k), o: Math.sin(k * Math.PI) * (1 - out) })
    })
    fly.forEach((f) => (f.style.opacity = String(Number(f.style.opacity) * (1 - po * 0.75))))
    const strike = eo(P(t, E('spreadsheets.') - 0.1, E('spreadsheets.') + 0.3))
    say(t, $('s12a'), [['Less time', T('less')], ['<br/>', T('chasing')], [`<span style="position:relative">chasing spreadsheets.<i style="position:absolute;left:-2%;top:54%;height:12px;border-radius:6px;background:var(--coral);width:${strike * 104}%"></i></span>`, T('chasing')]], { y: -220, size: 92, style: 'color:#fff', o: P(t, T('less') - 0.1, T('less')) })
    say(t, $('s12b'), [['More time', T('more')], ['<br/>', T('with', 2)], ['<span class="serif" style="font-size:1.25em">with people.</span>', T('with', 2), 'color:var(--l)']], { y: 200, size: 104, style: 'color:#fff' })
  }

  /* 13 · offer: first 100 churches · 40% off · CHRISTALONE */
  {
    const cn = Math.round(lerp(0, 100, eo(P(t, T('first') - 0.1, T('churches', 1) + 0.2))))
    $('s13count').innerHTML = `<div class="disp" style="font-size:250px;color:#fff">${cn}</div><div class="disp serif" style="font-size:84px;color:var(--lav)">first churches</div>`
    put($('s13count'), { c: true, y: -520, s: pop(t, S[12][1] + 0.1, 0.4), o: 1 })
    const pc = pop(t, T('forty') - 0.05, 0.4, 2.8)
    $('s13pct').innerHTML = `<div class="disp" style="font-size:300px;color:var(--l);text-shadow:0 20px 60px rgba(0,0,0,.35)">40%<span style="font-size:.38em;color:#fff;margin-left:.15em">off</span></div>`
    put($('s13pct'), { c: true, y: -20 + shake(t, T('forty'), 14), s: pc, o: P(t, T('forty') - 0.05, T('forty')), r: -3 })
    const word = 'CHRISTALONE', ty = P(t, T('christ') - 0.1, E('alone.'))
    const typed = word.slice(0, Math.round(ty * word.length))
    $('s13code').innerHTML = `<div style="display:flex;align-items:center;gap:8px;width:860px;height:170px;border-radius:40px;background:#fff;padding:0 46px;font:700 92px 'JetBrains Mono';letter-spacing:.04em;color:var(--ink);box-shadow:0 22px 0 -6px var(--ink)">${typed}<i style="display:inline-block;width:8px;height:96px;background:var(--p);opacity:${Math.floor(t * 2.5) % 2 ? 1 : 0.15}"></i></div><div style="font:600 34px Inter;color:#fff;text-align:center;margin-top:30px;opacity:.85">Use code at sign-up</div>`
    put($('s13code'), { c: true, y: 420, s: eo5(P(t, T('with', 3) - 0.2, T('with', 3) + 0.3)), o: P(t, T('with', 3) - 0.2, T('with', 3)) })
  }

  /* 14 · end card */
  {
    $('s14logo').innerHTML = `<div style="display:flex;align-items:center;gap:34px"><img src="../public/brand/mark.png" style="width:220px" /><div class="disp" style="font-size:150px;color:var(--p)">ZionDesk<span style="color:var(--ink)">.</span></div></div>`
    const l = pop(t, T('ziondesk', 2) - 0.1, 0.5, 2)
    put($('s14logo'), { c: true, y: -180, s: lerp(0.7, 1, l), o: P(t, T('ziondesk', 2) - 0.1, T('ziondesk', 2)) })
    say(t, $('s14line'), [['Built for', T('built', 2)], ['<span class="serif" style="font-size:1.2em;color:var(--p)">the Church.</span>', T('the', 6)]], { y: 90, size: 96 })
    const u = pop(t, E('church.', 3) + 0.4, 0.4)
    $('s14url').innerHTML = `<div style="padding:26px 60px;border-radius:999px;background:var(--ink);color:#fff;font:800 54px 'Bricolage Grotesque';letter-spacing:-.01em">ziondesk.com</div>`
    put($('s14url'), { c: true, y: 360, s: u, o: P(t, E('church.', 3) + 0.4, E('church.', 3) + 0.5) })
  }

  subtitles(t, light, scene)
}
window.seek = seek
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map((i) => (i.complete ? 1 : new Promise((r) => (i.onload = i.onerror = r)))))).then(() => { seek(0); return true })
</script>
</body>
</html>
