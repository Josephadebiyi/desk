<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ZionDesk launch reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="words.js"></script>
<style>
  :root { --lime: #c4ec62; --lime-ink: #18210a; --purple: #6c34ff; --ink: #111015; --muted: #8b8a98; --bg: #f6f5f1; --lav: #e9e5ff;
    --serif: 'DM Serif Display', Georgia, serif; --g: 'Inter Tight', Inter, sans-serif; --ui: Inter, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--W); height: var(--H); overflow: hidden; background: var(--bg); }
  body { font-family: var(--ui); color: var(--ink); font-size: var(--u); -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; inset: 0; overflow: hidden; perspective: 1600px;
    background: radial-gradient(60% 50% at 85% 10%, #ece8ff 0%, transparent 70%), radial-gradient(50% 45% at 5% 95%, #eef9d6 0%, transparent 70%), var(--bg); }
  .cam { position: absolute; inset: 0; transform-style: preserve-3d; }
  .a { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; will-change: transform, opacity; }
  .hide { display: none; }

  /* glossy orbs like the reference */
  .orb { width: calc(var(--u) * 5); height: calc(var(--u) * 5); border-radius: 50%; }
  .orb.l { background: radial-gradient(circle at 32% 28%, #f3ffd0 0%, #c4ec62 38%, #8fbf2a 100%); box-shadow: 0 calc(var(--u)*.8) calc(var(--u)*1.6) -0.6em rgba(120,160,30,.45); }
  .orb.p { background: radial-gradient(circle at 32% 28%, #d9ccff 0%, #8457ff 40%, #4b1fd6 100%); box-shadow: 0 calc(var(--u)*.8) calc(var(--u)*1.6) -0.6em rgba(80,40,200,.45); }

  /* kinetic type */
  .line { font-family: var(--g); font-weight: 600; letter-spacing: -.035em; white-space: nowrap; display: flex; gap: .26em; align-items: center; color: var(--ink); }
  .line .w { display: inline-block; }
  .it { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -.01em; color: var(--purple); }
  .lime-u { background: linear-gradient(transparent 62%, var(--lime) 62% 92%, transparent 92%); padding: 0 .08em; }
  .chip { display: inline-flex; align-items: center; gap: .32em; padding: .14em .46em .16em .2em; border-radius: 99em; background: #fff; box-shadow: 0 .08em .3em -0.05em rgba(30,20,80,.18), inset 0 0 0 .03em rgba(0,0,0,.05); }
  .chip i { width: 1em; height: 1em; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: .62em; color: #fff; }
  .ico-wa { background: #25d366; } .ico-nb { background: #f5c542; } .ico-sh { background: #1f9d55; }

  /* cards & UI */
  .card { background: #fff; border-radius: calc(var(--u)*2.4); box-shadow: 0 calc(var(--u)*2.4) calc(var(--u)*5) calc(var(--u)*-2.2) rgba(40,30,90,.35), 0 0 0 1px rgba(17,16,21,.04); color: var(--ink); }
  .avatar { border-radius: 50%; display: grid; place-items: center; font-family: var(--g); font-weight: 700; color: var(--ink); }
  .tile { width: calc(var(--u)*12); height: calc(var(--u)*8); padding: calc(var(--u)*.9); display: grid; grid-template-columns: repeat(4,1fr); gap: calc(var(--u)*.35); border-radius: calc(var(--u)*1.2); background: #fff; box-shadow: 0 calc(var(--u)*1) calc(var(--u)*2.4) calc(var(--u)*-1) rgba(30,20,80,.3); }
  .tile b { border-radius: calc(var(--u)*.25); background: #eceaf6; } .tile b:nth-child(4n+1) { background: #d7f0c2; }
  .numpill { padding: calc(var(--u)*1.2) calc(var(--u)*3.2); border-radius: calc(var(--u)*4); background: linear-gradient(180deg, #8457ff, #5a26f0); color: #fff; font-family: var(--g); font-weight: 800; font-size: calc(var(--u)*9); letter-spacing: -.04em; white-space: nowrap; box-shadow: 0 calc(var(--u)*2) calc(var(--u)*4) calc(var(--u)*-1.5) rgba(90,40,240,.6), inset 0 calc(var(--u)*.3) 0 rgba(255,255,255,.25); }
  .chips { display: flex; gap: calc(var(--u)*1); }
  .cchip { padding: calc(var(--u)*.7) calc(var(--u)*1.4); border-radius: 99em; background: #fff; font-family: var(--g); font-weight: 600; font-size: calc(var(--u)*1.9); color: #4b4860; box-shadow: 0 0 0 1px rgba(17,16,21,.06); white-space: nowrap; }
  .cchip.on { background: var(--ink); color: #fff; }
  .stamp { padding: calc(var(--u)*.6) calc(var(--u)*1.6); border: calc(var(--u)*.45) solid currentColor; border-radius: calc(var(--u)*1); font-family: var(--g); font-weight: 800; font-size: calc(var(--u)*3); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .stamp.red { color: #ef4444; } .stamp.green { color: #2f9e5b; }
  .phone { width: calc(var(--u)*34); height: calc(var(--u)*66); border-radius: calc(var(--u)*5); background: #0f0d16; padding: calc(var(--u)*1.1); box-shadow: 0 calc(var(--u)*4) calc(var(--u)*8) calc(var(--u)*-2) rgba(30,20,80,.45); }
  .screen { position: relative; width: 100%; height: 100%; border-radius: calc(var(--u)*4); overflow: hidden; background: #efe7dd; }
  .wa-head { height: calc(var(--u)*8.5); background: #075e54; color: #fff; display: flex; align-items: flex-end; gap: calc(var(--u)*1); padding: 0 calc(var(--u)*1.6) calc(var(--u)*1.3); }
  .wa-head .lg { width: calc(var(--u)*4); height: calc(var(--u)*4); border-radius: 50%; background: var(--ink); display: grid; place-items: center; }
  .wa-head .lg img { width: 55%; }
  .wa-head b { font-size: calc(var(--u)*1.7); display: block; } .wa-head small { font-size: calc(var(--u)*1.15); opacity: .8; }
  .bubble { position: absolute; left: calc(var(--u)*1.6); right: calc(var(--u)*5); background: #fff; border-radius: calc(var(--u)*.5) calc(var(--u)*1.8) calc(var(--u)*1.8) calc(var(--u)*1.8); padding: calc(var(--u)*1) calc(var(--u)*1.3); font-size: calc(var(--u)*1.6); line-height: 1.35; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .bubble .fl { display: block; font-size: .78em; font-weight: 700; color: #075e54; }
  .flag { width: calc(var(--u)*6); height: calc(var(--u)*6); border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 calc(var(--u)*.35) #fff, 0 calc(var(--u)*1) calc(var(--u)*2) calc(var(--u)*-.6) rgba(30,20,80,.35); }
  .flag svg { width: 100%; height: 100%; display: block; }
  .prompt { width: calc(var(--u)*56); padding: calc(var(--u)*1.6) calc(var(--u)*2); display: flex; align-items: center; gap: calc(var(--u)*1.2); font-size: calc(var(--u)*2.2); }
  .prompt .spark { width: calc(var(--u)*4.4); height: calc(var(--u)*4.4); border-radius: 50%; background: conic-gradient(from 90deg, var(--purple), var(--lime), var(--purple)); display: grid; place-items: center; flex-shrink: 0; }
  .prompt .spark i { width: 78%; height: 78%; border-radius: 50%; background: #fff; display: grid; place-items: center; font-style: normal; font-size: calc(var(--u)*1.8); }
  .prompt .caret { display: inline-block; width: 2px; height: 1.1em; background: var(--purple); vertical-align: middle; margin-left: 2px; }
  .flyer { width: calc(var(--u)*30); height: calc(var(--u)*37.5); border-radius: calc(var(--u)*2); overflow: hidden; position: relative; background: #1b0f45; box-shadow: 0 calc(var(--u)*3) calc(var(--u)*7) calc(var(--u)*-2) rgba(30,20,80,.55); }
  .flyer .art { position: absolute; inset: 0; background: radial-gradient(60% 45% at 80% 15%, #ffcf5a 0%, transparent 60%), radial-gradient(70% 50% at 0% 100%, #8457ff 0%, transparent 65%), linear-gradient(170deg, #2a1470, #120c2b); }
  .flyer .rays { position: absolute; left: 50%; top: 18%; width: 200%; aspect-ratio: 1; margin-left: -100%; transform-origin: 50% 0; background: repeating-conic-gradient(from 0deg at 50% 0, rgba(255,215,120,.18) 0 6deg, transparent 6deg 18deg); }
  .flyer .txt { position: absolute; left: 8%; right: 8%; bottom: 9%; color: #fff; }
  .flyer small { font-family: var(--g); font-weight: 700; letter-spacing: .3em; font-size: calc(var(--u)*1.05); color: var(--lime); }
  .flyer h4 { font-family: var(--serif); font-weight: 400; font-size: calc(var(--u)*5.6); line-height: .95; margin: .2em 0 .25em; }
  .flyer p { font-size: calc(var(--u)*1.35); opacity: .85; }
  .shim { position: absolute; inset: 0; background: linear-gradient(110deg, transparent 25%, rgba(255,255,255,.45) 45%, transparent 65%); background-size: 260% 100%; }
  .skel { position: absolute; inset: 0; background: #ece9f7; display: grid; align-content: end; gap: 6%; padding: 9%; }
  .skel i { display: block; height: 5%; border-radius: 99em; background: #dcd7f1; } .skel i:first-child { height: 14%; width: 70%; }
  .logo { width: calc(var(--u)*16); height: calc(var(--u)*16); border-radius: calc(var(--u)*4.4); background: var(--ink); display: grid; place-items: center; box-shadow: 0 calc(var(--u)*2.4) calc(var(--u)*5) calc(var(--u)*-1.6) rgba(17,16,21,.55), inset 0 calc(var(--u)*.3) 0 rgba(255,255,255,.12); }
  .logo img { width: 58%; }
  .wordmark { font-family: var(--g); font-weight: 800; font-size: calc(var(--u)*11); letter-spacing: -.05em; white-space: nowrap; display: flex; }
  .wordmark span { display: inline-block; }
  .cta { display: inline-flex; align-items: center; gap: .5em; padding: .55em 1.3em; border-radius: 99em; background: var(--ink); color: #fff; font-family: var(--g); font-weight: 700; font-size: calc(var(--u)*3); white-space: nowrap; box-shadow: 0 calc(var(--u)*1.6) calc(var(--u)*3) calc(var(--u)*-1) rgba(17,16,21,.45); }
  .cta b { color: var(--lime); }
  .url { font-family: var(--g); font-weight: 600; font-size: calc(var(--u)*2.2); color: var(--muted); white-space: nowrap; }
  .check { width: calc(var(--u)*9); height: calc(var(--u)*9); border-radius: 50%; background: radial-gradient(circle at 32% 28%, #f3ffd0 0%, #c4ec62 40%, #8fbf2a 100%); display: grid; place-items: center; box-shadow: 0 calc(var(--u)*1.2) calc(var(--u)*2.4) calc(var(--u)*-.8) rgba(120,160,30,.55); }
  .check svg { width: 55%; }
  .cursor { width: calc(var(--u)*3.2); filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
  .ripple { width: calc(var(--u)*5); height: calc(var(--u)*5); border-radius: 50%; border: calc(var(--u)*.3) solid var(--purple); }
  .cap { position: absolute; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 0 .28em; padding: .42em .9em .48em; border-radius: .9em; background: rgba(17,16,21,.88); color: rgba(255,255,255,.55); font-family: var(--g); font-weight: 700; line-height: 1.2; letter-spacing: -.01em; }
  .cap span.on { color: #fff; } .cap span.hi { color: var(--lime); font-family: var(--serif); font-style: italic; font-weight: 400; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .members { width: calc(var(--u)*50); padding: calc(var(--u)*2.2); }
  .members h3 { font-family: var(--g); font-weight: 600; font-size: calc(var(--u)*2.4); letter-spacing: -.02em; display: flex; justify-content: space-between; align-items: center; }
  .members h3 span { font-size: calc(var(--u)*1.3); font-weight: 600; color: #fff; background: var(--ink); padding: .5em 1em; border-radius: 99em; }
  .mrow { display: grid; grid-template-columns: calc(var(--u)*4.4) 1fr auto; gap: calc(var(--u)*1.2); align-items: center; padding: calc(var(--u)*.9) calc(var(--u)*1); border-radius: calc(var(--u)*1.4); margin-top: calc(var(--u)*.9); }
  .mrow .avatar { width: calc(var(--u)*4.4); height: calc(var(--u)*4.4); font-size: calc(var(--u)*1.5); }
  .mrow b { font-size: calc(var(--u)*1.7); display: block; } .mrow small { color: #6f6d7c; font-size: calc(var(--u)*1.3); }
  .mrow em { font-style: normal; font-size: calc(var(--u)*1.25); font-weight: 600; padding: .45em .9em; border-radius: 99em; background: var(--ink); color: #fff; }
  .mrow em.l { background: var(--lime); color: var(--lime-ink); }
  .scrib { overflow: visible; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="cam" id="cam">
    <div id="orbs"></div>

    <!-- shared kinetic headline -->
    <div class="a line" id="h1"></div>
    <div class="a line" id="h2"></div>

    <!-- S1/S2 chaos -->
    <img class="a" id="paper" src="assets/paperwork.png" style="width:calc(var(--u)*34)" alt="" />
    <div id="tiles"></div>

    <!-- S3 problem -->
    <div id="crowd"></div>
    <img class="a" id="coins" src="assets/coins.png" style="width:calc(var(--u)*24)" alt="" />
    <div class="a card" id="off1" style="padding:calc(var(--u)*1.6) calc(var(--u)*2.4)"><small style="color:#8b8a98;font-size:calc(var(--u)*1.4)">Sunday offering</small><div style="font-family:var(--g);font-weight:800;font-size:calc(var(--u)*5);letter-spacing:-.04em">₦250,000</div></div>
    <div class="a card" id="off2" style="padding:calc(var(--u)*1.6) calc(var(--u)*2.4)"><small style="color:#8b8a98;font-size:calc(var(--u)*1.4)">Sunday offering</small><div style="font-family:var(--g);font-weight:800;font-size:calc(var(--u)*5);letter-spacing:-.04em">₦250,000</div></div>
    <div class="a stamp red" id="x2">Counted ×2</div>

    <!-- S4 reveal -->
    <div class="a logo" id="logo"><img src="mark.png" alt="" /></div>
    <div class="a wordmark" id="word"></div>

    <!-- S5 members -->
    <div class="a card members" id="members">
      <h3>Members &amp; families <span>+ Add member</span></h3>
      <div id="mrows"></div>
    </div>

    <!-- S6 giving -->
    <div class="a numpill" id="num">₦1,284,500</div>
    <svg class="a scrib" id="scrib" viewBox="0 0 600 220"><path id="scribPath" d="M70 120 C 60 40, 300 10, 470 30 C 600 45, 590 170, 430 196 C 280 220, 60 205, 40 130 C 30 85, 120 50, 220 44" fill="none" stroke="#111015" stroke-width="5" stroke-linecap="round"/></svg>
    <div class="a chips" id="curs"></div>
    <div class="a stamp green" id="rcpt">Receipted ✓</div>

    <!-- S7 messaging -->
    <div class="a phone" id="phone"><div class="screen" id="screen"><div class="wa-head"><span class="lg"><img src="mark.png" alt="" /></span><div><b>Covenant Chapel</b><small>via ZionDesk · WhatsApp</small></div></div></div></div>
    <div id="flags"></div>

    <!-- S8 AI flyer -->
    <div class="a card prompt" id="prompt"><span class="spark"><i>✦</i></span><span id="ptext"></span><span class="caret" id="caret"></span></div>
    <div class="a flyer" id="flyer">
      <div class="skel" id="skel"><i></i><i></i><i style="width:60%"></i></div>
      <div id="flyerArt" style="position:absolute;inset:0"><div class="art"></div><div class="rays" id="rays"></div><div class="txt"><small>COVENANT CHAPEL</small><h4>Harvest<br/>Sunday</h4><p>Sun 12 Oct · 9:00 AM · Bring a friend</p></div></div>
      <div class="shim" id="shim"></div>
    </div>

    <!-- S9/S10 -->
    <div class="a check" id="check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#18210a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="a cta" id="cta">Start your free trial <b>→</b></div>
    <div class="a url" id="url">ziondesk.com · 7 days free</div>

    <img class="a" id="mascot" src="assets/mascot.png" style="width:calc(var(--u)*18)" alt="" />
    <svg class="a cursor" id="cursor" viewBox="0 0 24 24"><path d="M4 2l15 10-6.5 1.3L9 20z" fill="#111015" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
    <div class="a ripple" id="ripple"></div>
  </div>
  <div class="cap" id="cap"></div>
  <div class="flash" id="flash"></div>
</div>

<script>
const q = new URLSearchParams(location.search)
const REEL = q.get('format') === 'reel'
const W = REEL ? 1080 : 1920, H = REEL ? 1920 : 1080
const U = 10.8 // 1 layout unit in px (both formats are 1080 on the short side)
const R = document.documentElement.style
R.setProperty('--W', W + 'px'); R.setProperty('--H', H + 'px'); R.setProperty('--u', U + 'px')
const WORDS = window.__WORDS__ || []

/* ── helpers ── */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const P = (t, a, b) => clamp((t - a) / (b - a))
const lerp = (a, b, k) => a + (b - a) * k
const o3 = (k) => 1 - Math.pow(1 - k, 3)
const o5 = (k) => 1 - Math.pow(1 - k, 5)
const io = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2)
const back = (k, s = 1.9) => 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2)
const elastic = (k) => (k === 0 || k === 1 ? k : Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1)
const $ = (id) => document.getElementById(id)
const clean = (w) => w.toLowerCase().replace(/[^a-z0-9-]/g, '')
/** Start time of the n-th occurrence of a spoken word. */
const T = (word, n = 1) => { let c = 0; for (const x of WORDS) if (clean(x.w) === clean(word) && ++c === n) return x.s; return 0 }
const Te = (word, n = 1) => { let c = 0; for (const x of WORDS) if (clean(x.w) === clean(word) && ++c === n) return x.e; return 0 }
/** Place an absolutely-centred element: x/y/z in layout units, plus transforms. */
function put(el, { x = 0, y = 0, z = 0, s = 1, sx = 1, sy = 1, rx = 0, ry = 0, rz = 0, o = 1, blur = 0 } = {}) {
  if (o <= 0.001) { el.style.opacity = 0; el.style.visibility = 'hidden'; return }
  el.style.visibility = 'visible'
  el.style.transform = `translate(-50%,-50%) translate3d(${x * U}px,${y * U}px,${z * U}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s * sx},${s * sy})`
  el.style.opacity = o
  el.style.filter = blur > 0.02 ? `blur(${blur * U}px)` : ''
}
const off = (...els) => els.forEach((e) => put(e, { o: 0 }))
/** pop-in scale with overshoot, k=0..1 */
const pop = (t, at, d = 0.38) => back(P(t, at, at + d))

/* ── static content ── */
const ORBS = Array.from({ length: 9 }, (_, i) => ({ c: i % 3 === 0 ? 'p' : 'l', x: [-70, 66, -52, 74, -80, 40, -30, 86, 10][i], y: [-36, -30, 30, 26, -6, -44, 46, 4, 44][i], s: [1, 0.6, 0.8, 1.2, 0.5, 0.7, 0.55, 0.9, 0.45][i], ph: i * 1.7 }))
$('orbs').innerHTML = ORBS.map((o, i) => `<div class="a orb ${o.c}" id="orb${i}"></div>`).join('')
$('tiles').innerHTML = Array.from({ length: 6 }, (_, i) => `<div class="a tile" id="tile${i}">${'<b></b>'.repeat(12)}</div>`).join('')
const PEOPLE = [['AO', '#dcd8fd'], ['KM', '#d3e8fb'], ['GW', '#ddf5d3'], ['TA', '#fde3d6'], ['SE', '#fff1b8']]
$('crowd').innerHTML = PEOPLE.map(([i, bg], k) => `<div class="a avatar" id="pp${k}" style="width:calc(var(--u)*9);height:calc(var(--u)*9);font-size:calc(var(--u)*2.6);background:${bg};box-shadow:0 0 0 calc(var(--u)*.5) #fff, 0 calc(var(--u)*1.4) calc(var(--u)*3) calc(var(--u)*-1) rgba(30,20,80,.35)">${i}</div>`).join('')
const MROWS = [['AO', 'Ada Okafor', 'First visit · Sunday', 'New', 'l', '#dcd8fd'], ['KM', 'Kwame Mensah', 'Worker · Ushering', 'Worker', '', '#d3e8fb'], ['TA', 'Tunde & Bisi Adeyemi', 'Family · 4 people', 'Family', '', '#fde3d6'], ['GW', 'Grace Wanjiru', 'Member · Choir', 'Member', '', '#ddf5d3']]
$('mrows').innerHTML = MROWS.map(([i, n, s, tag, c, bg], k) => `<div class="mrow" id="mr${k}" style="background:${bg}66"><span class="avatar" style="background:${bg}">${i}</span><span><b>${n}</b><small>${s}</small></span><em class="${c}">${tag}</em></div>`).join('')
const CURS = [['₦', 'Naira', 'naira'], ['GH₵', 'Cedis', 'cedis'], ['$', 'Dollars', 'dollars']]
$('curs').innerHTML = CURS.map(([s, n], k) => `<span class="cchip" id="cc${k}">${s} ${n}</span>`).join('')
const MSGS = [['English', 'Welcome home, Ada! 🙏 See you Sunday at 9.'], ['Français', 'Bienvenue, Amélie ! À dimanche, 9 h.'], ['Português', 'Bem-vindo, João! Até domingo às 9h. 🙌']]
MSGS.forEach(([l, m], i) => { const b = document.createElement('div'); b.className = 'bubble'; b.id = 'bub' + i; b.innerHTML = `<span class="fl">${l}</span>${m}`; b.style.top = (11 + i * 10.5) * U + 'px'; $('screen').appendChild(b) })
const FLAG = {

    }
    m = { x: A ? 0 : 20, y: A ? 30 : 14, s: 0.85 * (1 + Math.max(0, Math.sin(P(t, mp, mp + 0.6) * Math.PI)) * 0.15), rz: 0, o: 1 - out }
  }

  /* S10 — end card */
  else {
    const k = P(t, t10 - 0.1, t10 + 0.6)
    put($('logo'), { y: A ? -40 : -24, ry: lerp(-360, 0, o3(k)), s: back(P(t, t10 - 0.1, t10 + 0.35), 2.4) * (A ? 0.9 : 0.8), o: P(t, t10 - 0.1, t10) })
    ;[...$('word').children].forEach((el, i) => { const kk = back(P(t, t10 + i * 0.035, t10 + 0.35 + i * 0.035), 2.4); el.style.transform = `translateY(${lerp(0.6, 0, kk)}em)`; el.style.opacity = P(t, t10 + i * 0.035, t10 + 0.1 + i * 0.035) })
    put($('word'), { y: A ? -18 : -6, s: A ? 0.8 : 0.85 })
    const st = T('start')
    const ck = back(P(t, st, st + 0.4), 2.2)
    const press = t > T('today') && t < T('today') + 0.15 ? 0.94 : 1
    put($('cta'), { y: A ? 4 : 12, s: ck * press * (A ? 1.05 : 1), o: P(t, st, st + 0.05) })
    put($('url'), { y: A ? 14 : 21, o: P(t, st + 0.3, st + 0.6) })
    const ca = T('today') - 0.05
    put($('cursor'), { x: lerp(A ? 30 : 40, A ? 8 : 10, io(P(t, st + 0.2, ca))), y: lerp(A ? 30 : 30, A ? 6 : 14, io(P(t, st + 0.2, ca))), o: P(t, st + 0.2, st + 0.4), s: press })
    put($('ripple'), { x: A ? 8 : 10, y: A ? 6 : 14, s: lerp(0.3, 1.8, P(t, ca, ca + 0.45)), o: (1 - P(t, ca, ca + 0.45)) * (t > ca ? 1 : 0) })
    const wave = Math.sin(t * 7) * 6
    m = { x: A ? 0 : 54, y: A ? 44 : 2, s: A ? 0.95 : 0.95, rz: wave * 0.4, o: P(t, t10, t10 + 0.3) }
  }

  // mascot: idle breathing (squash & stretch)
  const br = Math.sin(t * 5.2) * 0.025
  put($('mascot'), { x: m.x, y: m.y, s: m.s, sx: 1 + br, sy: 1 - br, rz: m.rz, o: m.o })

  // captions
  const cap = $('cap')
  const ph = PHRASES.find((p) => t >= p[0].s - 0.08 && t <= p[p.length - 1].e + 0.15)
  if (ph && !(t >= T('zionDesk', 2) - 0.1) && !(t >= T('meet') - 0.05 && t < T('every'))) {
    cap.style.display = 'flex'
    cap.innerHTML = ph.map((w) => `<span class="${t >= w.s - 0.03 ? 'on' : ''} ${HI.test(clean(w.w)) && t >= w.s - 0.03 ? 'hi' : ''}">${w.w.replace(/\.\.\.$/, '…')}</span>`).join(' ')
    cap.style.fontSize = (REEL ? 38 : 32) + 'px'
    cap.style.bottom = (REEL ? 300 : 54) + 'px'
    cap.style.maxWidth = (REEL ? 900 : 1300) + 'px'
  } else cap.style.display = 'none'
}
window.seek = seek
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map((i) => (i.complete ? 1 : new Promise((r) => (i.onload = i.onerror = r)))))).then(() => true)
window.DURATION = 31
seek(Number(q.get('t') || 0))
if (q.has('play')) { const t0 = performance.now(); const tick = () => { seek(((performance.now() - t0) / 1000) % 31); requestAnimationFrame(tick) }; tick() }
</script>
