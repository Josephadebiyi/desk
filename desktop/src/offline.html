<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src file:" />
    <title>ZionDesk — Offline</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        background: #07050d; color: #f4f1ff;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        display: grid; place-items: center; text-align: center; -webkit-app-region: drag;
      }
      main { max-width: 380px; padding: 24px; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 22px; margin: 20px 0 8px; font-weight: 700; }
      p { color: #b7aed6; margin: 0 0 24px; }
      button {
        -webkit-app-region: no-drag; cursor: pointer; border: 0; border-radius: 999px;
        background: #b8ff00; color: #12081f; font: inherit; font-weight: 700; padding: 11px 26px;
      }
      button:hover { filter: brightness(1.08); }
      small { display: block; margin-top: 16px; color: #7d7499; }
    </style>
  </head>
  <body>
    <main>
      <img src="../build/icon.png" alt="" />
      <h1>You're offline</h1>
      <p>ZionDesk can't reach the internet right now. Check your connection and try again.</p>
      <button id="retry" type="button">Try again</button>
      <small id="auto">We'll keep trying automatically.</small>
    </main>
    <script>
      const target = new URLSearchParams(location.search).get('retry') || 'https://ziondesk.com/dashboard'
      const go = () => { location.href = target }
      document.getElementById('retry').addEventListener('click', go)
      window.addEventListener('online', go)
      setInterval(() => { if (navigator.onLine) go() }, 15000)
    </script>
  </body>
</html>
